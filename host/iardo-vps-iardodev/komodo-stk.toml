[[stack]]
name = "iardo-vps-iardodev"

[stack.config]
server        = "iardo-vps-iardodev"
branch        = "kubernetes"
repo          = "iardo/srv-kube"
clone_path    = "/etc/srv-kube"
run_directory = "/etc/srv-kube"

# NOTE:
# Some services build their own image instead of downloading one,
# without "--build" Komodo tries to download it anyway and fails,
# "--build" tells it to build the image instead.
extra_args = ["--build"]

# NOTE:
# One-shot jobs that exit 0 by design after doing their work (seeding, migrations)
# without this Komodo flags them as unhealthy for exiting.
ignore_services = [
    "open-project-seeder",
    "open-project-upgrade",
]

file_paths = [
    "host/iardo-vps-iardodev/komodo-dpl.yml",
]

additional_env_files = [
    # HOST
    { track = true,  path = "host/iardo-vps-iardodev/.env" },
    { track = false, path = "host/iardo-vps-iardodev/.env-secrets" },
    { track = false, path = "host/iardo-vps-iardodev/.env-secrets.local" },
    # SERV
    { track = true, path = "serv/actual/.env" },
    { track = true, path = "serv/authentik/.env" },
    { track = true, path = "serv/linkace/.env" },
    { track = true, path = "serv/open-project/.env" },
    { track = true, path = "serv/outline/.env" },
]

pre_deploy.shell_mode = false
pre_deploy.command = """
    [ -f host/iardo-vps-iardodev/.env-secrets.local ] || cp host/iardo-vps-iardodev/.env-secrets host/iardo-vps-iardodev/.env-secrets.local

    # Actual
    bash serv/actual/task/task-gen-directories.sh
    bash serv/actual/task/task-set-permissions.sh

    # Authentik
    bash serv/authentik/task/task-gen-directories.sh
    bash serv/authentik/task/task-set-permissions.sh

    # Linkace
    bash serv/linkace/task/task-gen-directories.sh
    bash serv/linkace/task/task-set-permissions.sh

    # Nginx Proxy Manager
    bash serv/nginx-proxy-manager/task/task-gen-directories.sh
    bash serv/nginx-proxy-manager/task/task-set-permissions.sh

    # Open Project
    bash serv/open-project/task/task-gen-directories.sh
    bash serv/open-project/task/task-set-permissions.sh
"""
