# Gatus config for this host, mounted over serv/gatus/conf/config.yaml.
# Set GATUS_CONFIG in this host's .env (Override section) to use it.
#
# It checks every service Caddy serves on all hosts, through their public
# domains, so a failure also catches DNS, Caddy and TLS, not just the container.
# Anything below 500 counts as up, most of these answer a login redirect or 401 on "/".

endpoints:
  - name: gatus
    group: iardo-vps-iardolive
    url: "http://localhost:8080/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: beszel
    group: iardo-vps-iardodev
    url: "https://beszel.iardo.dev"
    interval: 5m
    conditions:
      - "[STATUS] < 500"
      - "[RESPONSE_TIME] < 5000"

  - name: bugsink
    group: iardo-vps-iardodev
    url: "https://bugsink.iardo.dev"
