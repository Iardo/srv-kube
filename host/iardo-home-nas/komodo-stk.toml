[[stack]]
name = "iardo-home-nas"

[stack.config]
server        = "iardo-home-nas"
branch        = "kubernetes"
repo          = "iardo/srv-kube"
clone_path    = "/etc/srv-kube"
run_directory = "/etc/srv-kube"

file_paths = [
    "host/iardo-home-nas/docker-compose.yml",
]

additional_env_files = [
    # HOST
    { track = true,  path = "host/iardo-home-nas/.env" },
    { track = false, path = "host/iardo-home-nas/.env-secrets" },
    { track = false, path = "host/iardo-home-nas/.env-secrets.local" },
]

pre_deploy.shell_mode = false
pre_deploy.command = """
    [ -f host/iardo-home-nas/.env-secrets.local ] || cp host/iardo-home-nas/.env-secrets host/iardo-home-nas/.env-secrets.local
"""
