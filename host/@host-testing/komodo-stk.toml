[[stack]]
name = "host-testing"

[stack.config]
server        = "host-testing"
branch        = "kubernetes"
repo          = "iardo/srv-kube"
clone_path    = "/etc/srv-kube"
run_directory = "/etc/srv-kube"

file_paths = [
    "host/@host-testing/komodo-dpl.yml",
]

# NOTE:
# One-shot jobs that exit 0 by design after doing their work (seeding, migrations)
# without this Komodo flags them as unhealthy for exiting.
ignore_services = [
    "infisical-migration",
    "open-project-seeder",
    "open-project-upgrade",
]

additional_env_files = [
    # HOST
    { track = true,  path = "host/@host-testing/.env" },
    { track = false, path = "host/@host-testing/.env-secrets" },
    { track = false, path = "host/@host-testing/.env-secrets.local" },
    # SERV
    { track = true, path = "serv/bugsink/.env" },
    { track = true, path = "serv/coolify/.env" },
    { track = true, path = "serv/grafana/.env" },
    { track = true, path = "serv/infisical/.env" },
    { track = true, path = "serv/mailpit/.env" },
    { track = true, path = "serv/openwebui/.env" },
    { track = true, path = "serv/passbolt/.env" },
    { track = true, path = "serv/woodpecker/.env" },
]

pre_deploy.shell_mode = false
pre_deploy.command = """
    [ -f host/@host-testing/.env-secrets.local ] || cp host/@host-testing/.env-secrets host/@host-testing/.env-secrets.local

    # Coolify
    bash serv/coolify/task/task-gen-directories.sh
    bash serv/coolify/task/task-set-permissions.sh

    # Caddy/dnsmasq bind-mount a single file, restart them only if it changed.
    bash utils/task/task-restart-if-changed.sh \
        host/@host-testing/caddyfile host/@host-testing/.caddyfile.sha256 \
        caddy-web caddy-ui-backend caddy-ui-frontend

    bash utils/task/task-restart-if-changed.sh \
        host/@host-testing/dnsmasq.conf host/@host-testing/.dnsmasq.conf.sha256 \
        dnsmasq
"""
