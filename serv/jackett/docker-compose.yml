# References
# --------------------
# https://github.com/linuxserver/docker-jackett

networks:
  jackett:
    name: jackett

services:
  jackett-web:
    image: lscr.io/linuxserver/jackett@sha256:e3ab924fd49c8a519d1f1f3cfe3a7273b7de552aef1beffcad4a122c5db28e15 # 0.25.39
    container_name: jackett-web
    restart: unless-stopped
    networks:
      - jackett
    ports:
      - ${JACKETT_WEB_HTTP:-9117}:9117
    volumes:
      - ./conf:/config
      - ./data/downloads:/downloads
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE:-America/Panama}
