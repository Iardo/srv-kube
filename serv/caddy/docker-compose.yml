# References
# --------------------
# https://hub.docker.com/_/caddy
# https://caddyserver.com/docs/quick-starts/docker

networks:
  caddy:
    name: caddy

volumes:
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config

services:
  caddy-web:
    image: caddy:2.10.2
    container_name: caddy-web
    restart: unless-stopped
    networks:
      - caddy
    ports:
      - ${CADDY_WEB_HTTP:-80}:80
      - ${CADDY_WEB_HTTPS:-443}:443
    # Other services each sit on their own isolated network, not caddy's,
    # so a per-host Caddyfile reaches them via their published host port
    # through host.docker.internal instead of by container name.
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Per-host override: Set CADDY_CADDYFILE in that host's .env
      # to a path relative to this file (e.g. ../../host/<host>/caddyfile),
      # otherwise falls back to this generic example.
      - ${CADDY_CADDYFILE:-./conf/Caddyfile}:/etc/caddy/Caddyfile
      