# References
# --------------------
# https://github.com/TwiN/gatus
# https://github.com/TwiN/gatus#docker

networks:
  gatus:
    name: gatus

services:
  gatus-web:
    image: twinproduction/gatus:v5.36.0
    container_name: gatus-web
    restart: unless-stopped
    networks:
      - gatus
    ports:
      - ${GATUS_WEB_HTTP:-8080}:8080
    volumes:
      - ./conf/config.yaml:/config/config.yaml
      - ./data:/data
    environment:
      TZ: ${TIMEZONE:-America/Panama}
