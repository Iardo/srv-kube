# References
# --------------------
# https://github.com/TwiN/gatus
# https://github.com/TwiN/gatus#docker

networks:
  gatus:
    name: gatus

services:
  gatus-web:
    image: twinproduction/gatus:v5.36.0
    container_name: gatus-web
    restart: unless-stopped
    networks:
      - gatus
    ports:
      - ${GATUS_WEB_HTTP:-8080}:8080
    volumes:
      # Per-host override: Set GATUS_CONFIG in that host's .env
      - ${GATUS_CONFIG:-./conf/config.yaml}:/config/config.yaml
      # Untracked, host-only endpoints (e.g. temporary checks), merged on top.
      # Set GATUS_CONFIG_LOCAL in that host's .env
      - ${GATUS_CONFIG_LOCAL:-./conf/config.local.yaml}:/config/config.local.yaml
      - ./data:/data
    environment:
      TZ: ${TIMEZONE:-America/Panama}
      GATUS_CONFIG_PATH: /config
