# References
# --------------------
# https://github.com/comfyanonymous/ComfyUI
# https://github.com/ai-dock/comfyui

# NOTE:
# This host installs ComfyUI at machine level instead (see "install.sh"),
# to access the GPU/Metal API directly. This compose file is only here for
# hosts where a containerized, GPU-passthrough deployment makes more sense.

networks:
  comfyui:
    name: comfyui

services:
  comfyui-web:
    # Versioned tags exist but track an old CUDA/base-image combo (stuck at v0.2.7);
    # "latest-cuda" is the actively maintained line. Pinned to what it resolved to on 2026-11-25.
    image: ghcr.io/ai-dock/comfyui@sha256:9f99d5383690f85f3f8eb8ccdde41ca3edfbfaecf41dcf53291741c1e8db297e
    container_name: comfyui-web
    restart: unless-stopped
    networks:
      - comfyui
    ports:
      - ${COMFYUI_WEB_HTTP:-8188}:8188
    volumes:
      - ./data/models:/opt/ComfyUI/models
      - ./data/output:/opt/ComfyUI/output
    environment:
      TZ: ${TIMEZONE:-America/Panama}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
