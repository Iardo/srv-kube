# References
# --------------------
# https://docs.mealie.io/documentation/getting-started/installation/docker/

networks:
  mealie:
    name: mealie

services:
  mealie-web:
    image: ghcr.io/mealie-recipes/mealie@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f # v3.31.0
    container_name: mealie-web
    restart: unless-stopped
    networks:
      - mealie
    ports:
      - ${MEALIE_WEB_HTTP:-9000}:9000
    volumes:
      - ./data:/app/data/
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE:-America/Panama}
