# References
# --------------------
# https://github.com/wger-project/docker
# https://hub.docker.com/r/wger/server

# NOTE:
# Minimal setup (just web + database).
# Ignoring redis (cache/celery), celery_worker, celery_beat and nginx,
# all optional per wger's own settings/main.py

networks:
  wger:
    name: wger

volumes:
  wger-database:
    name: wger-database

services:
  wger-web:
    image: wger/server:latest
    container_name: wger-web
    restart: unless-stopped
    depends_on:
      - wger-database
    networks:
      - wger
    ports:
      - ${WGER_WEB_HTTP:-8000}:8000
    volumes:
      - ./data/media:/home/wger/media
      - ./data/static:/home/wger/static
    env_file: .env
    environment:
      # A single connection string takes priority over DJANGO_DB_* entirely,
      # see wger's own settings/main.py.
      PS_DATABASE_URI: postgres://${WGER_POSTGRESQL_USER:?}:${WGER_POSTGRESQL_PASS:?}@wger-database:5432/wger
      SECRET_KEY: ${WGER_SECRET_KEY:?}
      DJANGO_DEBUG: 'False'


  wger-database:
    image: postgres:15
    container_name: wger-database
    restart: unless-stopped
    networks:
      - wger
    volumes:
      - wger-database:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: wger
      POSTGRES_USER: ${WGER_POSTGRESQL_USER:?}
      POSTGRES_PASSWORD: ${WGER_POSTGRESQL_PASS:?}
