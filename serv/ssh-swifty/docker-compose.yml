# References
# --------------------
# https://github.com/nirui/sshwifty

networks:
  ssh-swifty:
    name: ssh-swifty

services:
  ssh-swifty-web:
    image: niruix/sshwifty@sha256:f62f80a6104caad0c49624cef383e2da1bbd27f5500b11bf92bba4f50f7d86b1 # 0.4.13-beta-release
    container_name: ssh-swifty-web
    restart: unless-stopped
    networks:
      - ssh-swifty
    ports:
      - ${SSH_SWIFTY_WEB_HTTP:?}:8182
    env_file: .env
    environment:
      SSHWIFTY_SHAREDKEY: ${SSH_SWIFTY_SHARED_KEY:?}
