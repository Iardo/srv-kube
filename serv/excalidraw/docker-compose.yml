# References
# --------------------
# https://github.com/excalidraw/excalidraw/blob/master/docker-compose.yml
# https://docs.excalidraw.com/docs/introduction/development#self-hosting

networks:
  excalidraw:
    name: excalidraw

services:
  excalidraw-web:
    # No numbered release exists upstream, only "latest" (no sha-* tag since 2021).
    # Pinned to what "latest" resolved to on 2026-11-25.
    image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
    container_name: excalidraw-web
    restart: unless-stopped
    networks:
      - excalidraw
    ports:
      - ${EXCALIDRAW_WEB_HTTP:-5000}:80
    environment:
      - NODE_ENV=development
