networks:
  drawdb:
    name: drawdb
    
services:
  drawdb-web:
    image: wilmardma/drawdb@sha256:5444c49c9485b425b07ea4f62a186e0699ab86d1ceec785a97cb5b1a99dd855e
    container_name: drawdb-web
    restart: unless-stopped
    networks:
      - drawdb
    ports:
      - ${DRAWDB_WEB_HTTP:-3000}:80
