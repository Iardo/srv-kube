# References
# --------------------
# https://www.bugsink.com/docs/installation/
# https://www.bugsink.com/docs/docker-compose-install/
# https://github.com/bugsink/bugsink/blob/main/docker-compose-sample.yaml

networks:
  bugsink:
    name: bugsink

volumes:
  bugsink-database:
    name: bugsink-database

services:
  bugsink-web:
    image: bugsink/bugsink:2.5.1
    container_name: bugsink-web
    restart: unless-stopped
    depends_on:
      bugsink-database:
        condition: service_healthy
    networks:
      - bugsink
    ports:
      - ${BUGSINK_WEB_HTTP:-8000}:8000
    env_file: .env
    environment:
      PORT: 8000
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?}
      # Format: email:password - creates the initial admin user on first boot.
      CREATE_SUPERUSER: ${BUGSINK_CREATE_SUPERUSER:?}
      DATABASE_URL: postgresql://${BUGSINK_POSTGRESQL_USER:?}:${BUGSINK_POSTGRESQL_PASS:?}@bugsink-database:5432/bugsink

  bugsink-database:
    image: postgres:17-alpine
    container_name: bugsink-database
    restart: unless-stopped
    networks:
      - bugsink
    volumes:
      - bugsink-database:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h bugsink-database
      retries: 5
      start_period: 10s
      interval: 5s
      timeout: 5s
    environment:
      POSTGRES_DB: bugsink
      POSTGRES_USER: ${BUGSINK_POSTGRESQL_USER:?}
      POSTGRES_PASSWORD: ${BUGSINK_POSTGRESQL_PASS:?}
