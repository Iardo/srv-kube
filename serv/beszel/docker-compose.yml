# References
# --------------------
# https://beszel.dev/guide/hub-installation
# https://github.com/henrygd/beszel
# https://hub.docker.com/r/henrygd/beszel

networks:
  beszel:
    name: beszel

services:
  beszel-web:
    image: henrygd/beszel:0.18.8
    container_name: beszel-web
    restart: unless-stopped
    networks:
      - beszel
    ports:
      - ${BESZEL_WEB_HTTP:-8090}:8090
    volumes:
      - ./data:/beszel_data
      # Shared with beszel-agent below, so the hub reaches it over a unix
      # socket instead of the network (the two containers aren't on the
      # same Docker network otherwise, "localhost" wouldn't work between them).
      - ./socket:/beszel_socket
    environment:
      APP_URL: http://localhost:${BESZEL_WEB_HTTP:-8090}

  # Monitors this same host. TOKEN/KEY can't be generated ahead of time like
  # the rest of this repo's secrets: they only exist once the Hub above is
  # already running and you open its "Add System" dialog (or Settings >
  # Tokens) to create them, see init.sh.
  beszel-agent:
    image: henrygd/beszel-agent:0.18.8
    container_name: beszel-agent
    restart: unless-stopped
    depends_on:
      - beszel-web
    # Needed for accurate host-level stats (network throughput, etc), not
    # just container stats. Fine here since it only serves a unix socket,
    # not a TCP port, so there's nothing on the host network to collide with.
    network_mode: host
    volumes:
      - ./agent-data:/var/lib/beszel-agent
      - ./socket:/beszel_socket
      # Read-only, for per-container stats.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:${BESZEL_WEB_HTTP:-8090}
      TOKEN: ${BESZEL_AGENT_TOKEN:?}
      KEY: ${BESZEL_AGENT_KEY:?}
