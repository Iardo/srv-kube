# References
# --------------------
# https://github.com/wg-easy/wg-easy

networks:
  wireguard-easy:
    name: wireguard-easy

services:
  wireguard-easy-web:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wireguard-easy-web
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      - wireguard-easy
    ports:
      - ${WIREGUARD_EASY_VPN:-51820}:51820/udp
      - ${WIREGUARD_EASY_WEB_HTTP:-51821}:51821
    volumes:
      - ./conf:/etc/wireguard
    env_file: .env
    environment:
      PASSWORD_HASH: ${WIREGUARD_EASY_PASSWORD_HASH:?}
