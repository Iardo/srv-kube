# References
# --------------------
# https://woodpecker-ci.org/docs/administration/installation/docker-compose
# https://github.com/woodpecker-ci/woodpecker/blob/main/docker-compose.example.yaml
# https://github.com/dagger/dagger
# https://docs.dagger.io/reference/configuration/custom-runner/

networks:
  woodpecker:
    name: woodpecker

volumes:
  woodpecker-data:
    name: woodpecker-data
  dagger-engine-data:
    name: dagger-engine-data

services:
  woodpecker-web:
    image: woodpeckerci/woodpecker-server:v3.18.0
    container_name: woodpecker-web
    restart: unless-stopped
    networks:
      - woodpecker
    ports:
      - ${WOODPECKER_WEB_HTTP:-8000}:8000
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    env_file: .env
    environment:
      # NOTE: WOODPECKER_GITHUB_CLIENT / WOODPECKER_GITHUB_SECRET must be filled
      # in with a real OAuth app's credentials before login/CI will work.
      # Create one at https://github.com/settings/developers with callback
      # URL: ${WOODPECKER_HOST}/authorize
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT:?}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET:?}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?}

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.18.0
    container_name: woodpecker-agent
    restart: unless-stopped
    depends_on:
      - woodpecker-web
      - dagger-engine
    networks:
      - woodpecker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WOODPECKER_SERVER: woodpecker-web:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?}
      # NOTE:
      # Points any pipeline step running the "dagger" CLI at the shared engine below,
      # instead of each step starting its own from scratch.
      # This needs docker.sock mounted above, that's how it reaches it.
      _EXPERIMENTAL_DAGGER_RUNNER_HOST: container://dagger-engine

  dagger-engine:
    image: registry.dagger.io/engine:v0.21.9
    container_name: dagger-engine
    restart: unless-stopped
    privileged: true
    networks:
      - woodpecker
    volumes:
      - dagger-engine-data:/var/lib/dagger
