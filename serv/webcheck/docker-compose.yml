# https://github.com/Lissy93/web-check/blob/master/docker-compose.yml
# https://github.com/Lissy93/web-check?tab=readme-ov-file#deploying---option-3-docker

networks:
  webcheck:
    name: webcheck

services:
  webcheck:
    image: lissy93/web-check@sha256:3f46c4fdc6c41aac57b6e1965b6afaf4d19239ececdc7b4c12a89211890eaec8 # 2.4.0
    container_name: webcheck
    restart: unless-stopped
    networks:
      - webcheck
    ports:
      - ${WEBCHECK_WEB_HTTP:-3000}:3000
