# References
# --------------------
# https://github.com/opencloud-eu/opencloud
# https://github.com/opencloud-eu/opencloud-compose/blob/main/docker-compose.yml
# https://docs.opencloud.eu/docs/admin/getting-started/container/docker-compose/external-proxy

networks:
  opencloud:
    name: opencloud
  # Isolated on purpose: the thumbnails container decodes untrusted images.
  # It has no access to opencloud's secrets/data,
  # and no route to the internet either (matches upstream's own compose).
  opencloud-thumbnails:
    name: opencloud-thumbnails
    internal: true

volumes:
  opencloud-config:
    name: opencloud-config
  opencloud-data:
    name: opencloud-data

services:
  opencloud-web:
    image: docker.io/opencloudeu/opencloud@sha256:d7d5b547f9e41db24f030d6a6857c4184752b2c875c936952ee0601b6531cd51 # 9.1.1
    container_name: opencloud-web
    restart: unless-stopped
    user: '1000:1000'
    networks:
      - opencloud
      - opencloud-thumbnails
    ports:
      - ${OPENCLOUD_WEB_HTTP:?}:9200
    entrypoint:
      - /bin/sh
    # "opencloud init" only writes a config file with random secrets if one doesn't exist yet,
    # it fails harmlessly on every run after the first, hence the "|| true".
    command: ["-c", "opencloud init || true; opencloud server"]
    environment:
      OC_URL: 'https://${OPENCLOUD_DOMAIN:-localhost:${OPENCLOUD_WEB_HTTP:?}}'
      # Caddy already terminates real TLS in front of this container.
      PROXY_TLS: "false"
      IDM_ADMIN_PASSWORD: ${OPENCLOUD_ADMIN_PASSWORD:?}
      IDM_CREATE_DEMO_USERS: "false"
      # Thumbnails are generated by the separate "opencloud-thumbnails"
      # container below, not by this one.
      OC_EXCLUDE_RUN_SERVICES: thumbnails
      WEBDAV_THUMBNAILS_GENERATOR_URL: http://opencloud-thumbnails:9186
    volumes:
      - opencloud-config:/etc/opencloud
      - opencloud-data:/var/lib/opencloud

  opencloud-thumbnails:
    image: docker.io/opencloudeu/opencloud@sha256:d7d5b547f9e41db24f030d6a6857c4184752b2c875c936952ee0601b6531cd51 # 9.1.1
    container_name: opencloud-thumbnails
    restart: unless-stopped
    user: '1000:1000'
    networks:
      - opencloud-thumbnails
    command: ["thumbnails", "server"]
    environment:
      THUMBNAILS_HTTP_ADDR: 0.0.0.0:9186
      # No other container of this to discover, nothing to register with.
      MICRO_REGISTRY: memory
    read_only: true
    tmpfs:
      - /tmp:size=256m
