# References
# --------------------
# https://github.com/alexjustesen/speedtest-tracker/blob/main/.env.example
# https://github.com/alexjustesen/speedtest-tracker/blob/main/docker-compose.yml

networks:
  speedtest-tracker:
    name: speedtest-tracker
    
services:
  speedtest-tracker-web:
    # No versioned stable tag exists upstream, only "latest" (plus unstable "dev").
    # Pinned to what "latest" resolved to on 2026-11-25.
    image: henrywhitaker3/speedtest-tracker@sha256:47159a9402291275bd9f8a8ed4f5c1ce8502de216465ed29da8a3c995b807df1
    container_name: speedtest-tracker-web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "200k"
    networks:
      - speedtest-tracker
    ports:
      - ${SPEEDTEST_TRACKER_WEB_HTTP:-3000}:80
    volumes:
      - ./conf:/config
    environment:
      PGID: 1000
      PUID: 1000
      OOKLA_EULA_GDPR: true
      TZ: ${TIMEZONE:-America/Panama}
