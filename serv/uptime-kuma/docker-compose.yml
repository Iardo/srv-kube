# References
# --------------------
# https://github.com/louislam/uptime-kuma/blob/master/docker/docker-compose-dev.yml

networks:
  uptime-kuma:
    name: uptime-kuma

volumes:
  uptime-kuma:
    name: uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a # 2.5.12
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - uptime-kuma
    volumes:
      - uptime-kuma:/app/data
    ports:
      - ${UPTIME_KUMA_WEB_HTTP:-3001}:3001
