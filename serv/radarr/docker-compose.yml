# References
# --------------------
# https://github.com/linuxserver/docker-radarr

networks:
  radarr:
    name: radarr

services:
  radarr-web:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-web
    restart: unless-stopped
    networks:
      - radarr
    ports:
      - ${RADARR_WEB_HTTP:-7878}:7878
    volumes:
      - ./conf:/config
      - ./data/movies:/movies
      - ./data/downloads:/downloads
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE:-America/Panama}
