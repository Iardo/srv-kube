# References
# --------------------
# https://github.com/linuxserver/docker-radarr

networks:
  radarr:
    name: radarr

services:
  radarr-web:
    image: lscr.io/linuxserver/radarr@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7 # 7.0.3
    container_name: radarr-web
    restart: unless-stopped
    networks:
      - radarr
    ports:
      - ${RADARR_WEB_HTTP:-7878}:7878
    volumes:
      - ./conf:/config
      - ./data/movies:/movies
      - ./data/downloads:/downloads
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE:-America/Panama}
