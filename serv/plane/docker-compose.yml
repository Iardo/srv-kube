# References
# --------------------
# https://github.com/makeplane/plane
# https://developers.plane.so/self-hosting/methods/docker-compose
# https://raw.githubusercontent.com/makeplane/plane/master/deployments/cli/community/docker-compose.yml
#
# "plane-web" below is the bundled Caddy-based proxy (the official "proxy"
# service), not the frontend app itself (that's "plane-frontend", officially
# just "web"): it's the one piece meant to be reached from outside, routing
# internally to every other container over the "plane" network, so it's the
# only one that gets a published port.
#
# Its own automatic HTTPS is turned off (SITE_ADDRESS/CERT_* below): this
# host's own Caddy already terminates TLS and reverse-proxies here in plain
# HTTP, same as every other service in this repo.

x-db-env: &db-env
  PGHOST: plane-database
  PGDATABASE: plane
  POSTGRES_USER: ${PLANE_POSTGRESQL_USER:?}
  POSTGRES_PASSWORD: ${PLANE_POSTGRESQL_PASS:?}
  POSTGRES_DB: plane
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-cache
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-cache:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${PLANE_MINIO_ACCESS_KEY:?}
  MINIO_ROOT_PASSWORD: ${PLANE_MINIO_SECRET_KEY:?}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ''
  AWS_ACCESS_KEY_ID: ${PLANE_MINIO_ACCESS_KEY:?}
  AWS_SECRET_ACCESS_KEY: ${PLANE_MINIO_SECRET_KEY:?}
  AWS_S3_ENDPOINT_URL: http://plane-storage:9000
  AWS_S3_BUCKET_NAME: uploads

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_DEFAULT_USER: ${PLANE_MQ_USER:?}
  RABBITMQ_DEFAULT_PASS: ${PLANE_MQ_PASS:?}
  RABBITMQ_DEFAULT_VHOST: plane
  RABBITMQ_VHOST: plane

x-live-env: &live-env
  API_BASE_URL: http://plane-api:8000
  LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SECRET:?}

x-app-env: &app-env
  # Cosmetic only (email/invite links), the app itself works fine without
  # this matching reality: web/api/space/admin/live all sit behind the one
  # "plane-web" proxy, so browser requests between them are same-origin
  # regardless of what this says. Override in this host's ".env" once it has
  # a real domain, same idea as CADDY_DOMAIN elsewhere in this repo.
  WEB_URL: http://localhost:${PLANE_WEB_HTTP:?}
  DEBUG: 0
  CORS_ALLOWED_ORIGINS: ''
  GUNICORN_WORKERS: 1
  USE_MINIO: 1
  DATABASE_URL: postgresql://${PLANE_POSTGRESQL_USER:?}:${PLANE_POSTGRESQL_PASS:?}@plane-database:5432/plane
  SECRET_KEY: ${PLANE_SECRET_KEY:?}
  AMQP_URL: amqp://${PLANE_MQ_USER:?}:${PLANE_MQ_PASS:?}@plane-mq:5672/plane
  MINIO_ENDPOINT_SSL: 0
  LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SECRET:?}

networks:
  plane:
    name: plane

volumes:
  plane-database:
    name: plane-database
  plane-cache:
    name: plane-cache
  plane-mq:
    name: plane-mq
  plane-storage:
    name: plane-storage

services:
  plane-frontend:
    image: makeplane/plane-frontend:v1.5.0
    container_name: plane-frontend
    restart: unless-stopped
    networks:
      - plane
    depends_on:
      - plane-api
      - plane-worker

  plane-space:
    image: makeplane/plane-space:v1.5.0
    container_name: plane-space
    restart: unless-stopped
    networks:
      - plane
    depends_on:
      - plane-api
      - plane-worker
      - plane-frontend

  plane-admin:
    image: makeplane/plane-admin:v1.5.0
    container_name: plane-admin
    restart: unless-stopped
    networks:
      - plane
    depends_on:
      - plane-api
      - plane-frontend

  plane-live:
    image: makeplane/plane-live:v1.5.0
    container_name: plane-live
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - plane
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      - plane-api
      - plane-frontend

  plane-api:
    image: makeplane/plane-backend:v1.5.0
    container_name: plane-api
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    networks:
      - plane
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      plane-migrator:
        condition: service_completed_successfully
      plane-mq:
        condition: service_started

  plane-worker:
    image: makeplane/plane-backend:v1.5.0
    container_name: plane-worker
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    networks:
      - plane
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      - plane-api

  plane-worker-beat:
    image: makeplane/plane-backend:v1.5.0
    container_name: plane-worker-beat
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    networks:
      - plane
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      - plane-api

  # One-shot job: applies pending database schema migrations, then exits.
  # It must complete successfully before plane-api is allowed to start.
  plane-migrator:
    image: makeplane/plane-backend:v1.5.0
    container_name: plane-migrator
    restart: 'no'
    command: ./bin/docker-entrypoint-migrator.sh
    networks:
      - plane
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      plane-database:
        condition: service_healthy

  plane-database:
    image: postgres:15.7-alpine
    container_name: plane-database
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    networks:
      - plane
    volumes:
      - plane-database:/var/lib/postgresql/data
    environment:
      <<: *db-env
    healthcheck:
      test: pg_isready --username=${PLANE_POSTGRESQL_USER:?}
      interval: 5s
      timeout: 10s
      retries: 10

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: plane-cache
    restart: unless-stopped
    networks:
      - plane
    volumes:
      - plane-cache:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: plane-mq
    restart: unless-stopped
    networks:
      - plane
    volumes:
      - plane-mq:/var/lib/rabbitmq
    environment:
      <<: *mq-env

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: plane-storage
    restart: unless-stopped
    command: server /export --console-address ":9090"
    networks:
      - plane
    volumes:
      - plane-storage:/export
    environment:
      <<: *minio-env

  plane-proxy:
    image: makeplane/plane-proxy:v1.5.0
    container_name: plane-web
    restart: unless-stopped
    networks:
      - plane
    ports:
      - ${PLANE_WEB_HTTP:?}:80
    environment:
      APP_DOMAIN: localhost
      FILE_SIZE_LIMIT: 5242880
      CERT_EMAIL: ''
      CERT_ACME_CA: ''
      CERT_ACME_DNS: ''
      LISTEN_HTTP_PORT: 80
      SITE_ADDRESS: ':80'
      BUCKET_NAME: uploads
      TRUSTED_PROXIES: '0.0.0.0/0'
    depends_on:
      - plane-frontend
      - plane-api
      - plane-space
      - plane-admin
      - plane-live
