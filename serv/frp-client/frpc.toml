serverAddr = "{{ .Envs.FRP_CLIENT_SERVER_ADDR }}"
serverPort = {{ .Envs.FRP_CLIENT_SERVER_PORT }}

auth.method = "token"
auth.token = "{{ .Envs.FRP_CLIENT_AUTH_TOKEN }}"

# Add your own proxies below, one block per local port you want to share.
